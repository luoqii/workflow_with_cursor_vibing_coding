name: Android Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-hello-world-demo
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KVM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo chmod 666 /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --channel=3 --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
        with:
          build-root-directory: android-hello-world-demo

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android-hello-world-demo

      - name: Run unit tests
        run: ./gradlew test

      - name: Run managed device instrumentation tests
        run: ./gradlew pixel6Api34DebugAndroidTest
