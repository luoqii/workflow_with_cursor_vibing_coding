name: Android Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KVM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo chmod 666 /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --channel=3 --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew test

      - name: Run managed device instrumentation tests
        run: ./gradlew pixel6Api34DebugAndroidTest

      - name: Collect test reports
        if: always()
        id: collect_reports
        run: |
          rm -rf ci-reports
          UNIT_SRC="app/build/reports/tests"
          ANDROID_REPORT_ROOT="app/build/reports/androidTests"
          ANDROID_RESULT_ROOT="app/build/outputs/androidTest-results"
          ANDROID_DST="ci-reports/androidTest"
          UNIT_DST="ci-reports/unit"

          if [ -d "$UNIT_SRC" ]; then
            mkdir -p "$UNIT_DST"
            cp -R "$UNIT_SRC"/. "$UNIT_DST"/
            echo "unit=true" >> "$GITHUB_OUTPUT"
          else
            echo "unit=false" >> "$GITHUB_OUTPUT"
          fi

          ANDROID_HAS_REPORT=false
          if [ -d "$ANDROID_REPORT_ROOT" ]; then
            mkdir -p "$ANDROID_DST/html"
            cp -R "$ANDROID_REPORT_ROOT"/. "$ANDROID_DST/html"/
            ANDROID_HAS_REPORT=true
          fi

          if [ -d "$ANDROID_RESULT_ROOT" ]; then
            mkdir -p "$ANDROID_DST/raw"
            cp -R "$ANDROID_RESULT_ROOT"/. "$ANDROID_DST/raw"/
            ANDROID_HAS_REPORT=true
          fi

          if [ "$ANDROID_HAS_REPORT" = true ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unit test report
        if: always() && steps.collect_reports.outputs.unit == 'true'
        id: upload_unit_report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ci-reports/unit
          if-no-files-found: warn

      - name: Upload androidTest report
        if: always() && steps.collect_reports.outputs.android == 'true'
        id: upload_android_report
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: ci-reports/androidTest
          if-no-files-found: warn

      - name: 发布测试报告链接
        if: always()
        env:
          UNIT_REPORT_URL: ${{ steps.upload_unit_report.outputs.artifact-url }}
          ANDROID_REPORT_URL: ${{ steps.upload_android_report.outputs.artifact-url }}
        run: |
          {
            echo "### 📊 测试报告链接"
            if [ -n "$UNIT_REPORT_URL" ]; then
              echo "- 单元测试：[$UNIT_REPORT_URL]($UNIT_REPORT_URL)"
            else
              echo "- 单元测试：暂无可用报告"
            fi
            if [ -n "$ANDROID_REPORT_URL" ]; then
              echo "- Android Instrumentation 测试：[$ANDROID_REPORT_URL]($ANDROID_REPORT_URL)（HTML 入口：html/index.html，原始 XML：raw/）"
            else
              echo "- Android Instrumentation 测试：暂无可用报告"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
